<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOF Monitoring Log</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c1c1a;--mut:#66665f;--card:#fff;--bd:#d8d8d0;--ac:#1f5fa8;--ok:#2d7a3e;--wr:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--fg:#ececE8;--mut:#9a9a92;--card:#202020;--bd:#3a3a36;--ac:#6aa6ec;--ok:#6cc47e;--wr:#e8a050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151515;--fg:#ececE8;--mut:#9a9a92;--card:#202020;--bd:#3a3a36;--ac:#6aa6ec;--ok:#6cc47e;--wr:#e8a050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 2px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1 1 140px;min-width:0}
textarea{width:100%;box-sizing:border-box;min-height:56px;resize:vertical}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.ok{color:var(--ok)}.wr{color:var(--wr)}.mut{color:var(--mut);font-size:13px}
.ent{border-top:1px solid var(--bd);padding:8px 0}.ent:first-child{border-top:0}
.sm{padding:3px 8px;font-size:13px}
.banner{background:var(--card);border:1px solid var(--wr);border-radius:6px;padding:8px;margin-bottom:10px;font-size:13px}
.rep{page-break-after:always}dialog{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;max-width:340px}dialog::backdrop{background:rgba(0,0,0,.45)}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}main{padding:0}.card{border:0;padding:0}th{background:#eee}}
</style></head><body><main>
<section id="login" class="card noprint" hidden style="max-width:360px;margin:60px auto">
<h1>NOF Monitoring Log</h1><div class="sub">Log in to continue</div>
<div class="row"><input id="lus" placeholder="Username" autocomplete="username"></div>
<div class="row"><input id="lpw" type="password" placeholder="Password" autocomplete="current-password"></div>
<div id="lerr" class="wr" style="margin-bottom:8px"></div><button class="pri" id="lgo">Log in</button>
</section>
<div id="app" hidden>
<div class="noprint">
<h1>NOF Monitoring and Maintenance Log</h1>
<div class="sub">Entebbe International NOTAM Office – daily entries feed the monthly assigned-NOF report</div>
<div class="bar"><span id="who"></span><button class="sm" id="rf">Refresh</button><button class="sm" id="out">Log out</button></div>
<div id="banner"></div>
<div class="tabs"><button id="t1" class="on">Daily log</button><button id="t2" hidden>NOF view / monthly report</button></div>
</div>

<section id="v1" class="noprint">
<div class="card">
<div class="row">
<select id="nof"></select>
<input type="date" id="date">
<select id="type"><option value="issue">Issue / follow-up</option><option value="obs">Other observation</option></select>
<select id="status"><option>Outstanding</option><option>Resolved</option></select>
</div>
<div class="row"><select id="sers"></select></div>
<textarea id="issue" placeholder="Issues found"></textarea>
<textarea id="action" placeholder="Action taken (optional)" style="margin-top:6px"></textarea>
<div class="row" style="margin-top:8px"><button class="pri" id="add">Save entry</button>
<button id="clear">Checked – no issues (for the series selected)</button></div>
</div>
<h2 id="lh">Entries</h2><div id="list"></div>
</section>

<section id="v2" hidden>
<div class="card noprint"><div class="row">
<select id="rnof"></select><input type="month" id="rmon">
<button class="pri" id="print">Print / Save as PDF</button></div></div>
<div id="rep"></div>
</section>

</div>
<script>
const RAW="FAJN:ABDF HKJK:ABV EHAM:ABM DGAA:AB EBBR:AG FMMM:AB HECA:AW LKPR:AB DAAA EVRA FHSH FNLU GLRB HLLL LGGG LOWW LUKK OEJD ORBI UKKR UUUU:AEGHJKLNOPQUVWXYZ EGGN:ABDFHIJMPV HHAS LEAN LMMM LSSN OBBB OOMS UDDD LFFA:ABCDEFHPRWZ FZAZ:ABV DNLL:AB FXMM:AB HAAB:AC LDZA:AM VOMM:AC EYVN FIMP FQHQ GMMM HSSS LHBP LPPP LWSK OJAI ORBS UBBU EPWW:ABCDEFGH VIDP:ABCG LCNC:ABN ESSA:AB FVHA:AB HRYR:AB OAKB:DG EETN FBSK FSIA FWKI HBBA LAAA LJLA LQBH LYBB OKNO OTNO VABB EKCH:ABCD LTAA:ABCJ EDDZ:ABC LIIA:AEW FCCC:AB GOOO:AB HTDA:AB OPKC:AG EINN FDSK FLKK FYWH HCMM LBSF LLAD LRBB LZIB OMAE OYSN VECC";
const NOFS=RAW.split(" ").map(t=>{const[a,b]=t.split(":");return{c:a,s:(b||"A").split("").join(", ")}}).sort((x,y)=>x.c<y.c?-1:1);
const SER=Object.fromEntries(NOFS.map(n=>[n.c,n.s]));
const $=i=>document.getElementById(i);
const el=(t,txt,cls)=>{const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
let logs=[];
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const mname=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleString("en-GB",{month:"long",year:"numeric"})};
function fill(sel,items){sel.textContent="";items.forEach(([v,t])=>{const o=el("option",t);o.value=v;sel.append(o)})}
fill($("nof"),NOFS.map(n=>[n.c,n.c]));fill($("rnof"),[["","All NOFs"],...NOFS.map(n=>[n.c,n.c])]);
$("date").value=today();$("rmon").value=today().slice(0,7);
const showSer=()=>fill($("sers"),[["","All series / not series-specific"],...SER[$("nof").value].split(", ").map(x=>[x,"Series "+x])]);
$("nof").onchange=showSer;showSer();$("date").onchange=load;
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
function tab(n){["1","2"].forEach(i=>{$("v"+i).hidden=i!=n;$("t"+i).className=i==n?"on":""});if(n==2){renderRep();load()}}
let me=null;
async function call(m,u,b){const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch(e){}if(r.status==401&&u!="api/login"){me=null;showLogin();throw new Error("Please log in")}if(!r.ok)throw new Error(d.error||"HTTP "+r.status);return d}
const api=(m,p,b)=>call(m,"api/logs"+(p||""),b);
async function load(){try{logs=await api("GET","?months="+[...new Set([$("date").value.slice(0,7),$("rmon").value].filter(Boolean))].join(","));$("banner").textContent="";refresh()}catch(x){$("banner").textContent="";$("banner").append(el("div","Could not reach the server: "+x.message,"banner"))}}
async function save(e){try{await api("POST","",e);await load()}catch(x){alert("Could not save: "+x.message)}}
$("add").onclick=async()=>{const issue=$("issue").value.trim();if(!issue)return;
await save({date:$("date").value,nof:$("nof").value,series:$("sers").value,type:$("type").value,issue,action:$("action").value.trim(),status:$("type").value=="obs"?"":$("status").value});
$("issue").value="";$("action").value=""};
$("clear").onclick=()=>save({date:$("date").value,nof:$("nof").value,series:$("sers").value,type:"clear",issue:"",action:"",status:""});
function refresh(){renderList();if(!$("v2").hidden)renderRep()}
function renderList(){const d=$("date").value,L=$("list");L.textContent="";
$("lh").textContent="Entries for "+d+" (all NOFs)";
const xs=logs.filter(l=>l.date==d).sort((a,b)=>a.ts-b.ts);
if(!xs.length){L.append(el("div","Nothing logged yet for this date.","mut"));return}
xs.forEach(l=>{const r=el("div",null,"ent");
r.append(el("b",(l.nof||"General")+(l.series?" ("+l.series+")":"")+(l.type=="clear"?" – checked, no issues":l.type=="obs"?" – observation":" – ")));
if(l.status)r.append(el("b",l.status,l.status=="Resolved"?"ok":"wr"));
if(l.issue)r.append(el("div",l.issue));
if(l.action)r.append(el("div","Action: "+l.action,"mut"));r.append(el("div","Logged by "+(l.by||"—"),"mut"));
const bar=el("div");bar.style.marginTop="4px";
if(l.status&&(me.role=="admin"||l.byId==me.id)){const t=el("button",l.status=="Resolved"?"Reopen":"Mark resolved","sm");t.onclick=()=>upd(l,{status:l.status=="Resolved"?"Outstanding":"Resolved"});bar.append(t,document.createTextNode(" "))}
if(me.role=="admin"){const x=el("button","Delete","sm");x.onclick=()=>{if(confirm("Delete this entry?"))del(l)};bar.append(x)}r.append(bar);L.append(r)})}
async function upd(l,p){try{await api("PATCH","/"+l.id,p);await load()}catch(e){alert("Could not update")}}
async function del(l){try{await api("DELETE","/"+l.id);await load()}catch(e){alert("Could not delete")}}
function renderRep(){const R=$("rep");R.textContent="";const m=$("rmon").value,s=$("rnof").value;if(!m)return;
const inM=logs.filter(l=>(l.date||"").startsWith(m));
const codes=s?[s]:NOFS.map(n=>n.c).filter(c=>inM.some(l=>l.nof==c));
if(!s){const w=el("div",null,"card");w.append(el("h2","NOF summary – "+mname(m)));
const t=el("table"),hr=el("tr");["NOF","Days checked","Issues","Outstanding"].forEach(x=>hr.append(el("th",x)));t.append(hr);
codes.forEach(c=>{const xs=inM.filter(l=>l.nof==c),r=el("tr");r.append(el("td",c),el("td",String(new Set(xs.filter(l=>l.type!="obs").map(l=>l.date)).size)),el("td",String(xs.filter(l=>l.type=="issue").length)),el("td",String(xs.filter(l=>l.status=="Outstanding").length)));t.append(r)});
const sc=el("div",null,"scroll");sc.append(t);w.append(sc);
w.append(el("div",(NOFS.length-codes.length)+" of "+NOFS.length+" NOFs have no entries this month.","mut"));R.append(w)}
codes.forEach(c=>{const xs=inM.filter(l=>l.nof==c).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
const iss=xs.filter(l=>l.type=="issue"),obs=xs.filter(l=>l.type=="obs"),days=new Set(xs.filter(l=>l.type!="obs").map(l=>l.date)).size;
const w=el("div",null,"rep card");w.append(el("h2","MONTHLY ASSIGNED-NOF REPORT"));
const t1=el("table");[["NOF",c],["Reporting Month",mname(m)],["NOTAM series maintained",SER[c]],["Days with a logged check",String(days)]].forEach(([a,b])=>{const r=el("tr");r.append(el("th",a),el("td",b));t1.append(r)});
const sc=el("div",null,"scroll");sc.append(t1);w.append(sc);
w.append(el("h2","Checks per series"));
const tc=el("table"),hc=el("tr");["Series","Days checked","Issues","Outstanding"].forEach(x=>hc.append(el("th",x)));tc.append(hc);
SER[c].split(", ").forEach(x=>{const ds=new Set(xs.filter(l=>l.type!="obs"&&(l.series==x||(l.type=="clear"&&!l.series))).map(l=>l.date)),is=xs.filter(l=>l.type=="issue"&&l.series==x),r=el("tr");r.append(el("td",x),el("td",String(ds.size)),el("td",String(is.length)),el("td",String(is.filter(l=>l.status=="Outstanding").length)));tc.append(r)});
const s3=el("div",null,"scroll");s3.append(tc);w.append(s3);
w.append(el("h2","Significant issues, actions and status"));
const t=el("table"),hr=el("tr");["Significant Issue Identified","Action/Follow-up Undertaken","Status / Outstanding Matter"].forEach(x=>hr.append(el("th",x)));t.append(hr);
if(!iss.length){const r=el("tr"),cc=el("td","No significant issues logged for this month.");cc.colSpan=3;r.append(cc);t.append(r)}
iss.forEach(l=>{const r=el("tr");r.append(el("td",l.date+(l.series?" · Series "+l.series:"")+" – "+l.issue+(l.by?" (logged by "+l.by+")":"")),el("td",l.action||"—"),el("td",l.status||"—"));t.append(r)});
const s2=el("div",null,"scroll");s2.append(t);w.append(s2);
w.append(el("h2","Other Observations"));
if(!obs.length)w.append(el("div","None recorded.","mut"));obs.forEach(l=>w.append(el("div","• "+l.date+" – "+l.issue)));
w.append(el("div","Entebbe International NOTAM Office – NOF Monitoring and Maintenance","mut"));R.append(w)})}
$("rmon").onchange=load;$("rnof").onchange=renderRep;$("print").onclick=()=>window.print();
function showLogin(){$("app").hidden=true;$("login").hidden=false;$("lpw").value=""}
async function enter(u){me=u;$("login").hidden=true;$("app").hidden=false;$("who").textContent="Signed in as "+u.username+" ("+u.role+")";$("t2").hidden=u.role!="admin";tab(1);await load()}
$("lgo").onclick=async()=>{$("lerr").textContent="";try{await enter(await call("POST","api/login",{username:$("lus").value.trim().toLowerCase(),password:$("lpw").value}))}catch(e){$("lerr").textContent=e.message}};
$("lpw").onkeydown=e=>{if(e.key=="Enter")$("lgo").click()};
$("out").onclick=async()=>{try{await call("POST","api/logout")}catch(e){}me=null;logs=[];showLogin()};
$("rf").onclick=load;
(async()=>{try{await enter(await call("GET","api/me"))}catch(e){showLogin()}setInterval(()=>{if(me&&!document.hidden)load()},300000);document.addEventListener("visibilitychange",()=>{if(me&&!document.hidden)load()})})();
</script></main></body></html>
